name: edulink
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: edulink
      POSTGRES_USER: edulink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U edulink -d edulink"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - maildata:/data
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8026}:8025"
  app:
    build: ./app
    restart: unless-stopped
    init: true
    env_file:
      - /opt/myapp/.env
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql://edulink:${POSTGRES_PASSWORD}@db:5432/edulink
      MAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      EMAIL_FROM: "EduLink <noreply@edulink.local>"
      ALLOW_DEV_OTP: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8080/api/auth/google/callback}
    ports:
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  pgdata:
  maildata:
